<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Notes</title><style>
:root{font-family:system-ui,sans-serif;color:#18332f;background:#f2f6f3}*{box-sizing:border-box}body{margin:0}header{background:#173b33;color:white;padding:24px max(6vw,20px);display:flex;align-items:center;justify-content:space-between;gap:16px}header a{color:inherit;text-decoration:none}.brand{font-weight:800;font-size:24px}.tag{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#b9d5c2}main{max-width:920px;margin:48px auto;padding:0 24px}h1{font-size:36px;letter-spacing:-1px;margin:12px 0}p{line-height:1.6}.muted{color:#61746d}.panel{background:#fff;border:1px solid #d5e1d9;border-radius:18px;padding:28px;margin:24px 0}.auth{max-width:500px;margin:0 auto}label{display:block;font-size:14px;font-weight:600;margin:18px 0 7px}input,textarea{width:100%;font:inherit;border:1px solid #b6c9bf;border-radius:8px;padding:12px}textarea{min-height:115px;resize:vertical}button{font:inherit;font-weight:600;background:#1e604c;border:0;color:#fff;border-radius:8px;padding:11px 18px;cursor:pointer}.full{width:100%;margin-top:22px}.secondary{background:#e7efe9;color:#234c40}.row{display:flex;align-items:center;justify-content:space-between;gap:18px}.badge{display:inline-block;font:13px ui-monospace,monospace;background:#e3efe6;border:1px solid #c9ddcf;color:#254c39;border-radius:100px;padding:8px 12px}.notice{padding:12px 0;color:#8b4214}.note{white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:13px}a{color:#22644b}footer{max-width:920px;margin:48px auto;padding:0 24px;color:#61746d;font-size:13px}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}h1{font-size:29px}header{padding:20px}.panel{padding:20px}}
